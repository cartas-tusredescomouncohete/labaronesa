<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bar La Baronesa · Triana, Sevilla · Carta</title>
<meta name="description" content="Bar La Baronesa, Calle Esperanza de Triana 23, Sevilla. Desayunos y brunch, smoothies, healthy drinks, meriendas, cócteles, copas y cachimba. Carta completa con precios.">
<meta property="og:title" content="Bar La Baronesa · Triana, Sevilla">
<meta property="og:description" content="Desde el primer café hasta la última copa. Carta de desayunos y de tardes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Rammetto+One&display=swap" rel="stylesheet">
<style>
:root{--pe:#1E4B4F;--ma:#2A1A10;--oc:#E0A23F;--pa:#F1E9DB;--az:#A9BFD9;--tx:#2A1A10;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;font-variant-numeric:lining-nums!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--tx);background:var(--pa);line-height:1.55;font-size:16px}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
h1,h2,h3{font-family:'Rammetto One',serif;font-weight:400;line-height:1.08;text-wrap:balance}
p{text-wrap:pretty}
.nw{white-space:nowrap}
header{position:sticky;top:0;z-index:20;background:var(--ma);color:var(--pa);border-bottom:2px solid var(--oc)}
.hd{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:22px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo svg{width:38px;height:38px;flex:none}
.logo span{font-family:'Rammetto One',serif;font-size:19px;line-height:1}
.logo small{display:block;font-family:'Be Vietnam Pro',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--az);margin-top:4px}
nav{margin-left:auto;display:flex;gap:6px;align-items:center}
nav a{text-decoration:none;font-size:14px;font-weight:500;padding:8px 12px;border-radius:99px;color:var(--pa)}
nav a:hover{background:rgba(255,255,255,.1)}
.lang{font:700 13px 'Be Vietnam Pro',sans-serif;letter-spacing:.08em;color:var(--oc);background:transparent;border:2px solid rgba(224,162,63,.45);border-radius:99px;padding:8px 12px;cursor:pointer}
.lang:hover{border-color:var(--oc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px 'Be Vietnam Pro',sans-serif;text-decoration:none;border-radius:99px;padding:13px 22px;border:2px solid var(--oc);background:var(--oc);color:var(--ma);cursor:pointer}
.btn svg{width:20px;height:20px}
.btn.o{background:transparent;color:var(--pa)}
nav .btn{padding:9px 16px;font-size:14px}
section{padding:112px 20px}
.in{max-width:1080px;margin:0 auto}
.eye{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--oc);display:flex;align-items:center;gap:12px;margin-bottom:18px}
.eye::before{content:"";width:34px;height:2px;background:currentColor}
/* portada */
.hero{background:var(--ma);color:var(--pa);padding:84px 20px 100px;position:relative;overflow:hidden}
.hero .in{text-align:center;position:relative}
.hero .eye{justify-content:center}
.hero h1{font-size:clamp(40px,7vw,88px);max-width:900px;margin:0 auto 22px}
.hero h1 em{font-style:normal;color:var(--oc)}
.hero .sub{max-width:640px;margin:0 auto 28px;font-size:18px;color:#e6dccb}
.hero .ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.estado{display:inline-flex;gap:10px;align-items:center;font-size:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:8px 16px;margin-bottom:46px}
.estado i{width:10px;height:10px;border-radius:50%;background:#888;flex:none}
.estado.on i{background:#6BD08A}
.estado.off i{background:#E0674F}
.fl{position:absolute;opacity:.12;pointer-events:none}
/* reloj */
.reloj{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);background:var(--pa);color:var(--tx);border-radius:22px;overflow:hidden;text-align:left;border:3px solid var(--oc);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.rl{padding:28px 26px;background:var(--pe);color:var(--pa);display:flex;flex-direction:column;gap:14px}
.rl h2{font-size:26px}
.dial{width:100%;max-width:230px;margin:0 auto}
#mano{transform-origin:100px 100px;transition:transform .25s ease}
.hora{font-family:'Rammetto One',serif;font-size:44px;text-align:center;line-height:1}
.fase{text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--oc);font-weight:700}
.ctl{display:flex;flex-direction:column;gap:10px}
.ctl label{font-size:13px;font-weight:600;color:var(--az)}
input[type=range]{width:100%;accent-color:var(--oc);height:34px}
select{font:500 15px 'Be Vietnam Pro',sans-serif;padding:11px 12px;border-radius:10px;border:2px solid var(--az);background:#fff;color:var(--tx);width:100%}
.marca{display:flex;justify-content:space-between;font-size:12px;color:var(--az)}
.ab{margin-top:4px;font-size:14px;font-weight:600;padding:9px 14px;border-radius:10px;background:rgba(255,255,255,.1)}
.ab.si{color:#8FE3A8}.ab.no{color:#FFB09C}
.rr{position:relative;background:var(--ma);color:var(--pa);padding:34px 32px 26px;display:flex;flex-direction:column;overflow:hidden;
 background-image:radial-gradient(circle at 85% 12%,rgba(224,162,63,.16),transparent 45%),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 30px)}
.rr .fl{right:-36px;top:-24px;width:190px;opacity:.1}
.rr .eye{margin-bottom:10px}
.rr h3{font-size:clamp(26px,3vw,34px);color:var(--pa)}
.rr .rs{font-size:13px;color:var(--az);letter-spacing:.08em;text-transform:uppercase;margin:8px 0 18px;font-weight:600}
.picks{list-style:none;border-top:2px solid var(--oc);margin-bottom:22px}
.picks li{display:flex;align-items:baseline;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:16px;font-weight:500}
.picks i,.blk .row i{flex:1;border-bottom:2px dotted currentColor;opacity:.35;transform:translateY(-4px);min-width:16px}
.picks span small{display:block;font-size:12px;font-weight:500;color:var(--az);margin-top:1px}
.picks b{font-family:'Rammetto One',serif;font-weight:400;color:var(--oc);font-size:15px;white-space:nowrap}
.rr .btn{align-self:flex-start}
.rr .txt{margin-top:auto;padding-top:24px}
:lang(en) q{quotes:"“" "”"}
.rr .txt q{font-size:15px;font-weight:500;display:block;line-height:1.45;quotes:"«" "»";color:#e6dccb}
.rr .txt small{display:block;margin-top:8px;font-size:12px;color:var(--az)}
/* panes */
.cl{background:var(--pa)}
.cl h2{font-size:clamp(30px,4.6vw,54px);color:var(--pe);margin-bottom:16px;max-width:760px}
.cl .lead{max-width:660px;font-size:17px;margin-bottom:46px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.tabs button{font:600 14px 'Be Vietnam Pro',sans-serif;padding:10px 16px;border-radius:99px;border:2px solid var(--pe);background:transparent;color:var(--pe);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--pe);color:var(--pa)}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 28px;list-style:none;border-top:2px solid var(--pe)}
.lista li{padding:13px 0;border-bottom:1px solid rgba(30,75,79,.25);font-size:15px;display:flex;gap:10px;align-items:baseline}
.lista li::before{content:attr(data-n);font-family:'Rammetto One',serif;font-size:12px;color:var(--oc);min-width:22px}
.lista .ln{flex:1}
.lista .ln small{display:block;font-size:13px;color:#6b5646;margin-top:2px}
.lista b{font-family:'Rammetto One',serif;font-weight:400;font-size:13px;color:var(--pe);white-space:nowrap}
.nota{margin-top:18px;font-size:14px;color:#5a4636;max-width:700px}
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:56px}
.tile{border-radius:var(--r);padding:26px 24px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;position:relative;overflow:hidden}
.tile h3{font-size:24px}
.tile p{font-size:14px}
.tile .big{font-family:'Rammetto One',serif;font-size:34px;line-height:1}
.t1{background:var(--oc);color:var(--ma)}
.t2{background:var(--pe);color:var(--pa)}
.t2 .big{color:var(--oc)}
.t3{background:var(--ma);color:var(--pa)}
.t3 .big{color:var(--oc)}
/* carta */
.car{background:var(--pe);color:var(--pa)}
.car h2{font-size:clamp(30px,4.6vw,54px);margin-bottom:18px}
.car .lead{max-width:640px;margin-bottom:34px;color:#d8e4e0}
.msw{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;max-width:720px}
.msw button{text-align:left;cursor:pointer;border-radius:18px;padding:16px 20px;border:2px solid rgba(241,233,219,.35);background:rgba(0,0,0,.12);color:var(--pa);font:inherit}
.msw button strong{display:block;font-family:'Rammetto One',serif;font-weight:400;font-size:24px;line-height:1.1}
.msw button span{display:block;font-size:13px;color:var(--az);margin-top:6px;font-weight:600;letter-spacing:.04em}
.msw button[aria-pressed=true]{background:var(--oc);border-color:var(--oc);color:var(--ma)}
.msw button[aria-pressed=true] span{color:var(--ma);opacity:.75}
.mlead{font-size:15px;color:#d8e4e0;margin-bottom:24px;max-width:680px}
.ctools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.car .tabs{margin-bottom:0}
.car .tabs button{border-color:rgba(241,233,219,.5);color:var(--pa)}
.car .tabs button[aria-pressed=true]{background:var(--pa);color:var(--pe);border-color:var(--pa)}
.srch{position:relative;flex:0 1 260px}
.srch input{width:100%;font:500 15px 'Be Vietnam Pro',sans-serif;padding:11px 14px 11px 40px;border-radius:99px;border:2px solid rgba(241,233,219,.5);background:rgba(0,0,0,.15);color:var(--pa)}
.srch input::placeholder{color:#b9cbc6}
.srch input:focus{outline:none;border-color:var(--oc)}
.srch svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--az)}
.ctit{font-family:'Rammetto One',serif;font-size:clamp(24px,3vw,32px);color:var(--oc);margin:34px 0 22px;padding-bottom:14px;border-bottom:2px solid var(--oc)}
.blks{columns:3 280px;column-gap:36px}
.blk{break-inside:avoid;margin-bottom:34px;display:inline-block;width:100%}
.blk h3{font-size:19px;color:var(--oc);margin-bottom:10px;padding-bottom:10px;border-bottom:2px solid var(--oc);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.blk h3 em{font-style:normal;color:var(--pa);font-size:16px;white-space:nowrap}
.blk ul{list-style:none}
.blk li{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.blk .row{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:500}
.blk .row b{font-weight:600;white-space:nowrap;color:var(--pa)}
.blk li small{display:block;font-size:13px;color:#c9dad5;line-height:1.4;margin-top:2px}
.blk .bn{font-size:14px;color:#d8e4e0}
.blk .bn.sm{margin-top:10px;font-style:italic}
.blk.grid ul{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.blk.dark,.blk.box,.blk.badge,.blk.red{border-radius:var(--r);padding:18px 20px}
.blk.dark{background:var(--ma)}
.blk.box{background:rgba(255,255,255,.08);border:2px dashed rgba(224,162,63,.6)}
.blk.badge{background:var(--oc);color:var(--ma);clip-path:polygon(4% 8%,14% 0,28% 6%,42% 0,56% 7%,70% 0,84% 6%,96% 2%,100% 22%,96% 40%,100% 60%,96% 78%,100% 96%,84% 100%,70% 94%,56% 100%,42% 93%,28% 100%,14% 94%,2% 100%,4% 78%,0 60%,4% 40%,0 22%);padding:28px 26px}
.blk.badge h3{color:var(--ma);border:0;padding:0;font-size:18px}
.blk.badge .bn{color:var(--ma);font-weight:500}
.blk.red{background:#E2264A;color:#fff}
.blk.red h3{color:#fff;border-color:#fff}
.blk.red li{border-color:rgba(255,255,255,.3)}
.blk.dark h3,.blk.box h3{border-bottom-style:dashed}
.vacio{font-size:16px;color:#d8e4e0;padding:20px 0}
.iva{margin-top:10px;font-size:13px;color:#c9dad5}
/* casa */
.casa .gr{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:60px;align-items:center}
.poster{background:var(--pe);border:10px solid #2c5b5f;outline:3px solid var(--pe);outline-offset:6px;border-radius:6px;aspect-ratio:4/5;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 20px;color:var(--ma);font-family:'Rammetto One',serif;line-height:1.02;gap:4px}
.poster .p1{font-size:clamp(28px,3.6vw,44px);color:var(--ma)}
.poster .p2{font-size:clamp(24px,3.2vw,40px);color:var(--pa);text-transform:uppercase}
.poster .orn{width:60%;height:10px;margin:12px 0;border-top:2px solid var(--ma);border-bottom:2px solid var(--ma)}
.poster .p3{font-size:clamp(14px,1.6vw,19px);font-family:'Be Vietnam Pro',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.12em}
.poster .p4{font-size:clamp(30px,4vw,52px);color:var(--pa)}
.poster .p5{font-size:clamp(36px,4.8vw,62px);color:var(--oc)}
.poster .p6{font-size:clamp(14px,1.6vw,19px);font-family:'Be Vietnam Pro',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:var(--pa)}
.casa h2{font-size:clamp(30px,4.6vw,54px);color:var(--pe);margin-bottom:18px}
.casa p{margin-bottom:14px;max-width:540px}
.fr{margin:22px 0;border-left:4px solid var(--oc);padding-left:18px;font-size:17px;font-weight:500;max-width:540px}
.fr small{display:block;font-size:12px;color:#6b5646;margin-top:6px;font-weight:400}
.red{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.red a{text-decoration:none;font-size:14px;font-weight:600;border:2px solid var(--pe);color:var(--pe);padding:9px 16px;border-radius:99px}
/* donde */
.dn{background:var(--ma);color:var(--pa)}
.dn h2{font-size:clamp(30px,4.6vw,54px);margin-bottom:34px}
.dg{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:44px}
.sem{list-style:none;border-top:2px solid var(--oc);margin:18px 0}
.sem li{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.16);font-size:15px;gap:12px}
.sem li.hoy{color:var(--oc);font-weight:700}
.dn address{font-style:normal;font-size:17px;margin-bottom:6px}
.tel{font-family:'Rammetto One',serif;font-size:28px;text-decoration:none;color:var(--oc);display:inline-block;margin:8px 0}
.dn iframe{width:100%;height:100%;min-height:360px;border:0;border-radius:var(--r);background:#ddd}
footer{background:#000;color:#bbb;font-size:12px;padding:22px 20px;text-align:center}
.barra{display:none}
@media(max-width:820px){
 section{padding:72px 20px}
 .hd{padding:10px 16px;gap:10px}
 .logo span{font-size:17px}
 nav a:not(.btn){display:none}
 nav .btn.o{display:none}
 .hero{padding:48px 20px 64px}
 .hero .sub{font-size:16px}
 .estado{margin-bottom:30px}
 .reloj{grid-template-columns:minmax(0,1fr)}
 .rl{padding:22px 20px}
 .rr{padding:26px 22px 22px}
 .tres{grid-template-columns:minmax(0,1fr)}
 .tile{min-height:0}
 .casa .gr,.dg{grid-template-columns:minmax(0,1fr);gap:30px}
 .poster{aspect-ratio:auto;padding:40px 20px}
 .lista{grid-template-columns:minmax(0,1fr)}
 .msw button{padding:14px 16px}
 .msw button strong{font-size:20px}
 .srch{flex:1 1 100%;order:-1}
 .car .tabs{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
 .car .tabs::-webkit-scrollbar{display:none}
 .car .tabs button{flex:none}
 .ctools{display:block}
 .ctools .tabs{margin-top:12px}
 body{padding-bottom:77px}
 .barra{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;gap:10px;padding:10px 14px;background:var(--ma);border-top:2px solid var(--oc)}
 .barra a{flex:1;padding:14px 8px}
}
@media(max-width:380px){.blk.grid ul{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
 <div class="hd">
  <a class="logo" href="#top" aria-label="Bar La Baronesa">
   <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#1E4B4F" stroke="#E0A23F" stroke-width="2"/><path d="M13 29V11h8a5 5 0 0 1 2 9.6A5.4 5.4 0 0 1 21.5 29H13zm4-14.5v4h3.6a2 2 0 0 0 0-4H17zm0 7.6v4.3h4.2a2.1 2.1 0 0 0 0-4.3H17z" fill="#E0A23F"/></svg>
   <span>La Baronesa<small>Bar · Triana</small></span>
  </a>
  <nav aria-label="Menú">
   <a href="#dia" data-n="0"></a><a href="#panes" data-n="1"></a><a href="#carta" data-n="2"></a><a href="#casa" data-n="3"></a><a href="#donde" data-n="4"></a>
   <button class="lang" type="button"></button>
   <a class="btn o" href="tel:+34954005396" data-i="llamar"></a>
  </nav>
 </div>
</header>

<main id="top">
<section class="hero">
 <svg class="fl" style="left:-40px;top:30px;width:240px" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 95C50 60 20 50 5 20c35 0 45 25 45 45 0-25 20-50 45-55-5 40-45 40-45 85z" fill="#E0A23F"/></svg>
 <svg class="fl" style="right:-50px;bottom:60px;width:260px;transform:scaleX(-1)" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 95C50 60 20 50 5 20c35 0 45 25 45 45 0-25 20-50 45-55-5 40-45 40-45 85z" fill="#A9BFD9"/></svg>
 <div class="in">
  <p class="eye" data-i="eye"></p>
  <h1 data-i="h1"></h1>
  <p class="sub" data-i="sub"></p>
  <div class="ctas">
   <a class="btn" href="tel:+34954005396"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><span data-i="llamarAl"></span> <span class="nw">954 00 53 96</span></a>
   <a class="btn o" href="https://www.google.com/maps/place/?q=place_id:ChIJzwSb3T9sEg0R06MvnFpovPs" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span data-i="comoLlegar"></span></a>
  </div>
  <p class="estado" id="estado"><i></i><span></span></p>

  <div class="reloj" id="dia">
   <div class="rl">
    <h2 data-i="relojH"></h2>
    <svg class="dial" viewBox="0 0 200 200" aria-hidden="true">
     <circle cx="100" cy="100" r="92" fill="#143538" stroke="#E0A23F" stroke-width="4"/>
     <g stroke="#A9BFD9" stroke-width="2" id="marcas"></g>
     <g id="mano"><line x1="100" y1="100" x2="100" y2="34" stroke="#F1E9DB" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="30" r="7" fill="#E0A23F"/></g>
     <circle cx="100" cy="100" r="7" fill="#F1E9DB"/>
    </svg>
    <div class="hora" id="hora">7:00</div>
    <div class="fase" id="fase"></div>
    <div class="ctl">
     <label for="dsel" data-i="dia"></label>
     <select id="dsel"><option value="1"></option><option value="2"></option><option value="3"></option><option value="4"></option><option value="5"></option><option value="6"></option><option value="0"></option></select>
     <label for="hr" data-i="mueve"></label>

 /* ====== Carta completa ====== */
 var menu=(N.h>=4&&N.h<12)?'d':'t',cat=null,query='';
 function blk(b,items){
  var cls='blk'+(b.dark?' dark':'')+(b.box?' box':'')+(b.badge?' badge':'')+(b.red?' red':'')+(b.grid?' grid':'')+(b.wide?' wide':'');
  var h='<div class="'+cls+'"><h3><span>'+esc(tx(b.h))+'</span>'+(b.hp!=null?'<em>'+fp(b.hp)+'</em>':'')+'</h3>';
  if(b.box||b.badge)h+='<p class="bn">'+esc(tx(b.note))+'</p>';
  items=items||b.items;
  if(items&&items.length){
   h+='<ul>'+items.map(function(x){
    var p=x[1]!=null?'<b>'+fp(x[1])+'</b>':'';
    return'<li><div class="row"><span>'+esc(tx(x[0]))+'</span>'+(p?'<i></i>'+p:'')+'</div>'+(x[2]?'<small>'+esc(tx(x[2]))+'</small>':'')+'</li>';
   }).join('')+'</ul>';
  }
  if(b.note&&!b.box&&!b.badge)h+='<p class="bn sm">'+esc(tx(b.note))+'</p>';
  return h+'</div>';
 }
 function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
 function pinCarta(){
  var t=T[lang],M=MENUS[menu];
  document.querySelectorAll('#msw button').forEach(function(b){var m=MENUS[b.dataset.m];b.setAttribute('aria-pressed',b.dataset.m===menu);b.innerHTML='<strong>'+esc(tx(m.t))+'</strong><span>'+esc(tx(m.sub))+'</span>'});
  $('mlead').textContent=tx(M.lead);
  if(!cat||!M.cats.some(function(c){return c.k===cat}))cat=M.cats[0].k;
  $('ctabs').innerHTML=M.cats.map(function(c){return'<button type="button" data-c="'+c.k+'" aria-pressed="'+(c.k===cat&&!query)+'">'+esc(tx(c.t))+'</button>'}).join('');
  var out='';
  if(query){
   var qn=norm(query),seen=[];
   M.cats.forEach(function(c){c.b.forEach(function(b){
    if(seen.indexOf(b)>-1)return;seen.push(b);
    var hit=norm(tx(b.h)).indexOf(qn)>-1;
    var its=(b.items||[]).filter(function(x){return hit||norm(tx(x[0])+' '+tx(x[2]||'')).indexOf(qn)>-1});
    if(its.length||(hit&&!b.items))out+=blk(b,its);
   })});
   if(!out)out='<p class="vacio">'+t.sinRes+'</p>';
  }else{
   M.cats.forEach(function(c){if(c.k===cat)c.b.forEach(function(b){out+=blk(b)})});
  }
  $('blks').innerHTML=out;
  $('ctit').textContent=query?t.resultados+' · '+tx(M.t):tx(M.cats.filter(function(c){return c.k===cat})[0].t);
 }
 function elige(m,c){menu=m;cat=c||null;query='';$('q').value='';pinCarta()}
 $('msw').addEventListener('click',function(e){var b=e.target.closest('button');if(b)elige(b.dataset.m)});
